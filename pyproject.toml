[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pad_python"
version = "4.0.0"
description = "Precipitation Attribution Distance for fields on a planar grid"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gregor Skok", email = "Gregor.Skok@fmf.uni-lj.si"}]
dependencies = ["numpy>=1.23"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
examples = ["netCDF4", "matplotlib>=3.5", "cartopy"]

[project.urls]
Homepage = "https://github.com/skokg/PAD"
Repository = "https://github.com/skokg/PAD"
Issues = "https://github.com/skokg/PAD/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["pad_python"]
packages = []
include-package-data = false
